# Migrated from package.json#pnpm for pnpm v11.
# `onlyBuiltDependencies` (array) was removed in v11 → replaced by `allowBuilds` (map).

allowBuilds:
  esbuild: true
  lefthook: true
  # sharp: prebuilt binary (@img/sharp-linux-x64) è sempre disponibile; lo script di install
  # tenta un build da sorgente se trova una libvips globale (es. pacman) e fallisce.
  sharp: false
  swup: true
autoInstallPeers: true

ignoredOptionalDependencies:
  - '@img/sharp-wasm32'
minimumReleaseAgeExclude:
  - path-to-regexp@6.3.0
  - postcss@8.5.10
  - fast-uri@3.1.1
